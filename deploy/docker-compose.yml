# Base compose file for scripturejam.
# Usage:
#   With Cloudflare Tunnel:  docker compose -f docker-compose.yml -f compose.cloudflare.yml up -d
#   With Caddy (direct):     docker compose -f docker-compose.yml -f compose.caddy.yml up -d
#   Local/dev (port 3000):   docker compose up -d
#
# Postgres's password is read from a file via Docker secrets (below), not a plaintext env var —
# generate it first:
#   mkdir -p secrets && openssl rand -hex 24 > secrets/postgres_password.txt && chmod 600 secrets/postgres_password.txt
# DATABASE_URL in .env still needs the same value embedded (the app reads a connection string,
# not a secret file) — this only keeps the password out of the postgres container's own env/logs.

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

services:
  app:
    image: ghcr.io/your-org/scripturejam:latest
    build:
      context: ..
      dockerfile: app/server/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:4000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

volumes:
  redis_data:
  postgres_data:

networks:
  internal:
    driver: bridge
